<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心流写作</title>
<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-hover: #F5F5F3;
    --border: #E8E8E4;
    --border-light: #F0F0EC;
    --text-primary: #1A1A18;
    --text-secondary: #6B6B66;
    --text-tertiary: #9C9C96;
    --accent: #2D5A27;
    --accent-light: #E8F0E6;
    --accent-hover: #3D7A35;
    --orange: #C4660A;
    --orange-light: #FFF3E6;
    --red: #B83232;
    --red-light: #FDEAEA;
    --blue: #2D5A8A;
    --blue-light: #E6EEF8;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Login Screen ===== */
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 48px 40px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    max-width: 400px;
    width: 100%;
  }

  .login-logo {
    width: 64px; height: 64px;
    background: var(--accent);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 32px;
    margin: 0 auto 20px;
  }

  .login-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
  .login-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

  .btn-google {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .btn-google:hover { background: var(--surface-hover); box-shadow: var(--shadow-md); }

  .btn-google svg { width: 20px; height: 20px; }

  .login-loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== App Layout ===== */
  .app-layout {
    display: none;
    min-height: 100vh;
    flex-direction: row;
  }
  .app-layout.visible { display: flex; }

  /* ===== Sidebar ===== */
  .app-sidebar {
    width: 240px;
    min-width: 240px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .sidebar-logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
  }

  .sidebar-logo-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  /* Sidebar User Section */
  .sidebar-user {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius-md);
  }

  .sidebar-user-info {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-user-details {
    flex: 1;
    min-width: 0;
  }

  .sidebar-user-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-user-email {
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-logout {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    width: 100%;
  }
  .btn-logout:hover { color: var(--red); border-color: var(--red); background: var(--red-light); }

  /* Streak Stats Section */
  .streak-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .streak-stats {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .streak-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-light);
  }

  .streak-stat-row:last-child {
    border-bottom: none;
  }

  .streak-stat-label {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .streak-stat-value {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }

  /* Calendar Section */
  .calendar-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius-md);
  }

  .calendar-header {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .calendar-months {
    display: flex;
    gap: 2px;
    margin-bottom: 4px;
    font-size: 9px;
    color: var(--text-tertiary);
    overflow-x: auto;
  }

  .calendar-month-label {
    flex-shrink: 0;
    text-align: center;
    white-space: nowrap;
  }

  .calendar-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .calendar-dow {
    display: flex;
    gap: 2px;
    font-size: 9px;
    color: var(--text-tertiary);
    margin-bottom: 4px;
  }

  .calendar-dow span {
    width: 12px;
    text-align: center;
    flex-shrink: 0;
  }

  .calendar-grid {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .calendar-week {
    display: flex;
    gap: 2px;
  }

  .calendar-day {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--border-light);
    flex-shrink: 0;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
  }

  .calendar-day.level-1 { background: #d4e8d0; }
  .calendar-day.level-2 { background: #a3d49a; }
  .calendar-day.level-3 { background: #6bba62; }
  .calendar-day.level-4 { background: #2D5A27; }

  .calendar-day.future {
    background: transparent;
    border: 1px dashed var(--border);
  }

  .calendar-day:hover {
    outline: 1px solid var(--accent);
  }

  .calendar-day[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition);
    margin-bottom: 4px;
    z-index: 100;
  }

  .calendar-day[data-tooltip]:hover::after {
    opacity: 1;
  }

  .calendar-legend {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 10px;
    color: var(--text-tertiary);
    margin-top: 8px;
  }

  .legend-box {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }

  /* Sidebar Actions */
  .sidebar-actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-export-sidebar {
    padding: 8px 12px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent-light);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }
  .btn-export-sidebar:hover { background: var(--accent); color: white; }

  /* ===== Main Content ===== */
  .app-main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ===== Navigation Tabs ===== */
  .nav-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-tab {
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: color var(--transition);
    white-space: nowrap;
  }

  .nav-tab:hover { color: var(--text-primary); }

  .nav-tab.active {
    color: var(--accent);
  }

  .nav-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent);
  }

  .badge {
    display: inline-block;
    margin-left: 4px;
    padding: 2px 6px;
    background: var(--orange-light);
    color: var(--orange);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    min-width: 18px;
    text-align: center;
  }

  /* ===== Views ===== */
  .views-container {
    flex: 1;
    overflow-y: auto;
  }

  .view {
    display: none;
    padding: 24px;
  }

  .view.active { display: block; }

  /* ===== Writing View ===== */
  #view-write {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 24px;
  }

  .write-top {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .writing-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-card {
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    text-align: center;
    transition: all var(--transition);
  }

  .stat-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  .stat-card.running {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }

  .progress-wrap {
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .progress-label {
    color: var(--text-secondary);
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .timer-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--surface-hover);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border-light); }

  .btn-danger {
    background: var(--red-light);
    color: var(--red);
    border: 1px solid var(--red);
  }
  .btn-danger:hover { background: var(--red); color: white; }

  .btn-orange {
    background: var(--orange);
    color: white;
  }
  .btn-orange:hover { opacity: 0.9; }

  .quick-idea-trigger, .research-toggle, .btn-save-manual {
    background: var(--surface-hover);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 12px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .quick-idea-trigger:hover, .research-toggle:hover, .btn-save-manual:hover {
    background: var(--border-light);
  }

  .research-toggle.active {
    background: var(--blue-light);
    color: var(--blue);
    border-color: var(--blue);
  }

  /* Quick Idea Panel */
  .quick-idea-panel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 1000;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .quick-idea-panel.open { display: block; }

  .quick-idea-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .quick-idea-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
  }

  .quick-idea-label {
    color: var(--text-primary);
  }

  .kbd-hint {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  kbd {
    display: inline-block;
    padding: 2px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 10px;
    font-family: monospace;
  }

  .panel-close {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 16px;
    transition: color var(--transition);
  }
  .panel-close:hover { color: var(--text-primary); }

  .quick-idea-row {
    display: flex;
    gap: 8px;
  }

  .quick-idea-input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    resize: none;
  }

  .quick-idea-recent {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .idea-tag {
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .idea-tag-remove {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }

  /* Split Container (Writing + Research) */
  .split-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    flex: 1;
  }

  .app.split-mode .split-container {
    grid-template-columns: 1fr 1fr;
  }

  .split-left, .split-right {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .split-right {
    display: none;
  }

  .app.split-mode .split-right {
    display: flex;
  }

  /* Editor Styles */
  .editor-wrapper {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .editor-header {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .editor-title-input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
  }

  .save-indicator {
    font-size: 11px;
    color: var(--text-tertiary);
    opacity: 0;
    transition: opacity var(--transition);
  }

  .save-indicator.show { opacity: 1; color: var(--accent); }

  .toolbar {
    display: flex;
    gap: 4px;
    padding: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    flex-wrap: wrap;
  }

  .toolbar-btn {
    padding: 4px 8px;
    background: transparent;
    border: 1px solid var(--border-light);
    border-radius: 4px;
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    transition: all var(--transition);
  }

  .toolbar-btn:hover {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text-primary);
  }

  .toolbar-btn.active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .editor {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 14px;
    line-height: 1.8;
    outline: none;
    resize: none;
    min-height: 300px;
  }

  .editor:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-light);
  }

  /* Ideas View */
  #view-ideas {
    padding: 24px;
  }

  .ideas-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .idea-card {
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    transition: all var(--transition);
    position: relative;
  }

  .idea-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  .idea-time {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
  }

  .idea-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-primary);
    word-break: break-word;
  }

  .idea-delete-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 14px;
    transition: color var(--transition);
    opacity: 0;
  }

  .idea-card:hover .idea-delete-btn { opacity: 1; }
  .idea-delete-btn:hover { color: var(--red); }

  /* Research View */
  #view-research {
    padding: 24px;
  }

  .research-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .research-item {
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition);
  }

  .research-item:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  .research-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .research-meta {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .research-preview {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .research-editor {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 14px;
    line-height: 1.8;
    outline: none;
    resize: none;
    min-height: 200px;
  }

  .research-editor:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-light);
  }

  .research-note-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

// ===== Firebase Utilities =====
function userCol(name) {
  return db.collection('users').doc(currentUser.uid).collection(name);
}

async function fsAdd(col, data) {
  const snap = await userCol(col).add(data);
  return snap.id;
}

async function fsUpdate(col, docId, data) {
  await userCol(col).doc(docId).update(data);
}

async function fsDelete(col, docId) {
  await userCol(col).doc(docId).delete();
}

async function fsGet(col) {
  const snap = await userCol(col).get();
  return snap.docs.map(doc => ({ _docId: doc.id, ...doc.data() }));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function countWords(text) {
  const cleaned = text.replace(/[\n\r]/g, ' ').replace(/\s+/g, ' ').trim();
  return cleaned.split(' ').filter(w => w.length > 0).length;
}

function updateWordCount() {

  const target = 1000;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressLabel').textContent = wc >= target ? '太棒了！' : `距离目标 ${target - wc} 字`;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function toggleTimer() {
  if (isTimerRunning) pauseTimer();
  else startTimer();
}

function startTimer() {
  isTimerRunning = true;
  document.getElementById('timerCard').classList.add('running');
  document.getElementById('btnStart').innerHTML = '&#10074;&#10074; 暂停';
  document.getElementById('btnReset').style.display = '';
  document.getElementById('editor').focus();
  timerInterval = setInterval(() => {
    timerSeconds++;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
  }, 1000);
}

function pauseTimer() {
  isTimerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerCard').classList.remove('running');
  document.getElementById('btnStart').innerHTML = '&#9654; 继续写作';
}

let resetPending = false;
async function resetToday() {
  if (!resetPending) {
    resetPending = true;
    const btn = document.getElementById('btnReset');
    btn.textContent = '确认清空？';
    btn.classList.remove('btn-secondary');
    btn.classList.add('btn-danger');
    setTimeout(() => {

        resetPending = false;
        btn.textContent = '重新开始';
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-secondary');

// ===== Auto-save =====
async function autoSave() {
  const html = getEditorHTML();
  const text = getEditorText();
  const title = document.getElementById('writingTitle').value.trim();
  const date = todayKey();
  const wc = countWords(text);

  const payload = { title, html, text, date, wordCount: wc, timerSeconds };
  if (todayDocId) {
    await fsUpdate('today', todayDocId, payload);
  } else {
    todayDocId = await fsAdd('today', payload);
  }

  await saveToHistory(text, html, title, 'auto');

  const ind = document.getElementById('saveIndicator');
  ind.textContent = '✓ 已自动保存';
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 1500);
}

async function manualSave() {
  const text = getEditorText();
  if (!text.trim()) return;
  const html = getEditorHTML();
  const title = document.getElementById('writingTitle').value.trim();

  const date = todayKey();
  const wc = countWords(text);
  const payload = { title, html, text, date, wordCount: wc, timerSeconds };
  if (todayDocId) {
    await fsUpdate('today', todayDocId, payload);
  } else {
    todayDocId = await fsAdd('today', payload);
  }

  await saveToHistory(text, html, title, 'manual');
  showSaveToast('已手动保存！', 'manual');

  const ind = document.getElementById('saveIndicator');
  ind.textContent = '✓ 已手动保存';
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2500);
}

async function saveToHistory(text, html, title, saveType) {
  if (!text.trim()) return;
  const date = todayKey();
  const wc = countWords(text);

  if (saveType === 'auto') {
    const existing = historyCache.find(h => h.date === date && h.saveType === 'auto');
    if (existing) {
      await fsUpdate('history', existing._docId, { title, text, html, wordCount: wc, timerSeconds, saveType: 'auto' });
      existing.title = title;
      existing.text = text;
      existing.html = html;
      existing.wordCount = wc;
      existing.timerSeconds = timerSeconds;
    } else {
      const docId = await fsAdd('history', { date, title, text, html, wordCount: wc, timerSeconds, saveType: 'auto' });
      historyCache.unshift({ _docId: docId, date, title, text, html, wordCount: wc, timerSeconds, saveType: 'auto' });
    }
  } else {
    const docId = await fsAdd('history', { date, title, text, html, wordCount: wc, timerSeconds, saveType: 'manual' });
    historyCache.unshift({ _docId: docId, date, title, text, html, wordCount: wc, timerSeconds, saveType: 'manual' });
  }

  if (typeof renderStreakStats === 'function') renderStreakStats();
}

function sanitizeFilename(str) {
  return str.replace(/[\/\\:*?"<>|]/g, '_').replace(/\s+/g, '_').substring(0, 60);
}

function htmlToMarkdown(html) {
  if (!html) return '';
  const div = document.createElement('div');
  div.innerHTML = html;
  let md = '';
  function walk(node) {
    if (node.nodeType === 3) {
      md += node.textContent;
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName;
    if (/^H[1-6]$/.test(tag)) {
      const level = parseInt(tag[1]);
      md += '\n' + '#'.repeat(level) + ' ';
      for (const c of node.childNodes) walk(c);
      md += '\n\n';
    } else if (tag === 'P') {
      for (const c of node.childNodes) walk(c);
      md += '\n\n';
    } else if (tag === 'BR') {
      md += '\n';
    } else if (tag === 'B' || tag === 'STRONG') {
      md += '**';
      for (const c of node.childNodes) walk(c);
      md += '**';
    } else if (tag === 'I' || tag === 'EM') {
      md += '*';
      for (const c of node.childNodes) walk(c);
      md += '*';
    } else if (tag === 'DIV') {
      for (const c of node.childNodes) walk(c);
      md += '\n';
    } else {
      for (const c of node.childNodes) walk(c);
    }
  }
  for (const c of div.childNodes) walk(c);
  return md.replace(/\n{3,}/g, '\n\n').trim();
}

    const saveType = entry.saveType === 'manual' ? '手动保存' : '自动保存';
    const wc = entry.wordCount || 0;
    const mins = Math.floor((entry.timerSeconds || 0) / 60);
    let content = `---\ntitle: "${title}"\ndate: ${date}\ntype: writing\nword_count: ${wc}\nwriting_minutes: ${mins}\nsave_type: ${saveType}\n---\n\n`;
    if (entry.title) content += `# ${entry.title}\n\n`;
    content += entry.html ? htmlToMarkdown(entry.html) : (entry.text || '');
    const filename = `${sanitizeFilename(title)}_${date}.md`;
    files.push({ filename, content });
  });

  const selectedIdeas = ideasCache.filter(i => exportSelections.ideas.has(i._docId));
  if (selectedIdeas.length > 0) {
    let content = `---\ntitle: "随机想法"\ndate: ${todayKey()}\ntype: ideas\n---\n\n# 随机想法\n\n`;
    selectedIdeas.forEach(idea => {
      const d = idea.createdAt instanceof Date ? idea.createdAt : (idea.createdAt?.toDate ? idea.createdAt.toDate() : new Date());
      const t = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      content += `- **${t}**: ${idea.text}\n`;
    });
    files.push({ filename: `随机想法_${todayKey()}.md`, content });
  }

  researchCache.forEach(item => {
    if (!exportSelections.research.has(item._docId)) return;
    const dateStr = getItemDate(item);
    const title = item.title || '未命名调研';
    let content = `---\ntitle: "${title}"\ndate: ${dateStr}\ntype: research\n---\n\n# ${title}\n\n`;
    content += item.bodyHTML ? htmlToMarkdown(item.bodyHTML) : (item.body || '');
    const filename = `${sanitizeFilename(title)}_${dateStr}.md`;
    files.push({ filename, content });
  });

  if (files.length === 0) {
    showSaveToast('没有可导出的内容', 'auto');
    closeExportModal();
    return;
  }

  files.forEach(f => downloadFile(f.filename, f.content));

  showSaveToast(`已导出 ${files.length} 个文件！`, 'manual');
  closeExportModal();
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== Toast =====
function showSaveToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 3000);
}

// ===== Utility =====
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== Auth State Handler =====
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appLayout').classList.add('visible');

    // Set user info in sidebar
    document.getElementById('sidebarUserName').textContent = user.displayName || user.email || 'User';
    document.getElementById('sidebarUserEmail').textContent = user.email || '';
    document.getElementById('sidebarUserAvatar').src = user.photoURL || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ctext x=%2212%22 y=%2718%22 text-anchor=%22middle%22 font-size=%2212%22 fill=%22%23999%22%3EU%3C/text%3E%3C/svg%3E';

    initApp();
  } else {
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appLayout').classList.remove('visible');
  }
});

// ===== Init =====
async function initApp() {
  ideasCache = await fsGet('ideas');
  researchCache = await fsGet('research');
  historyCache = await fsGet('history');
  historyCache.sort((a, b) => {
    if (a.date !== b.date) return (b.date || '').localeCompare(a.date || '');
    if (a.saveType === 'manual' && b.saveType !== 'manual') return -1;
    if (b.saveType === 'manual' && a.saveType !== 'manual') return 1;
    return 0;
  });

  const todaySnap = await userCol('today').where('date', '==', todayKey()).limit(1).get();
  if (!todaySnap.empty) {
    const doc = todaySnap.docs[0];
    todayDocId = doc.id;
    todayData = doc.data();
    setEditorHTML(todayData.html || '');
    document.getElementById('writingTitle').value = todayData.title || '';
    timerSeconds = todayData.timerSeconds || 0;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
    if (timerSeconds > 0) document.getElementById('btnReset').style.display = '';
  }

  updateWordCount();
  updateIdeasBadge();
  updateResearchBadge();
  renderIdeas();
  renderStreakStats();
}

// ===== Streak & Calendar =====
function renderStreakStats() {
  const year = new Date().getFullYear();
  document.getElementById('streakYear').textContent = year + '年';

  // Group by (date, title) → take MAX per group → SUM groups per day
  // This correctly handles: re-saves of same article (MAX) + multiple articles per day (SUM)
  const dayTitleMap = {};
  historyCache.forEach(entry => {
    const date = entry.date;
    if (!date || !date.startsWith(String(year))) return;
    const wc = entry.wordCount || 0;
    const title = entry.title || '_untitled_';
    const key = date + '|||' + title;
    if (!dayTitleMap[key] || wc > dayTitleMap[key]) {
      dayTitleMap[key] = wc;
    }
  });

  const dayMap = {};
  Object.keys(dayTitleMap).forEach(key => {
    const date = key.split('|||')[0];
    dayMap[date] = (dayMap[date] || 0) + dayTitleMap[key];
  });

  let totalWords = 0;
  Object.values(dayMap).forEach(wc => totalWords += wc);

  const writingDays = Object.keys(dayMap).length;

  let streak = 0;
  const today = new Date();
  let checkDate = new Date(today);
  const todayStr = todayKey();
  if (!dayMap[todayStr]) {
    checkDate.setDate(checkDate.getDate() - 1);
  }
  while (true) {
    const key = `${checkDate.getFullYear()}-${String(checkDate.getMonth()+1).padStart(2,'0')}-${String(checkDate.getDate()).padStart(2,'0')}`;
    if (dayMap[key] && dayMap[key] > 0) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      break;
    }
  }

  document.getElementById('statTotalWords').textContent = totalWords.toLocaleString('zh-CN');
  document.getElementById('statWritingDays').textContent = writingDays;
  document.getElementById('statStreak').textContent = streak;

  renderCalendar(dayMap, year);
}

function renderCalendar(dayMap, year) {
  const grid = document.getElementById('calendarGrid');
  const monthsRow = document.getElementById('calendarMonths');
  const today = new Date();

  const startDate = new Date(year, 0, 1);
  const startDay = startDate.getDay();
  const adjustedStart = new Date(startDate);
  adjustedStart.setDate(adjustedStart.getDate() - ((startDay + 6) % 7));

  const endDate = new Date(year, 11, 31);

  let currentDate = new Date(adjustedStart);
  let weekHtml = '';
  let weeksHtml = '';
  let monthPositions = [];
  let currentMonth = -1;
  let weekCount = 0;

  while (currentDate <= endDate || currentDate.getDay() !== 1) {
    const dow = currentDate.getDay();
    const isMonday = dow === 1;

    if (isMonday || currentDate.getTime() === adjustedStart.getTime()) {
      if (weekHtml) {
        weeksHtml += '<div class="calendar-week">' + weekHtml + '</div>';
        weekCount++;
      }
      weekHtml = '';

      if (currentDate.getMonth() !== currentMonth && currentDate.getFullYear() === year) {
        currentMonth = currentDate.getMonth();
        monthPositions.push({ month: currentMonth, week: weekCount });
      }
    }

    const key = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`;
    const words = dayMap[key] || 0;
    const isFuture = currentDate > today;
    const isThisYear = currentDate.getFullYear() === year;

    let level = '';
    if (isFuture) {
      level = 'future';
    } else if (words > 0) {
      if (words >= 1000) level = 'level-4';
      else if (words >= 500) level = 'level-3';
      else if (words >= 200) level = 'level-2';
      else level = 'level-1';
    }

    const tooltip = isFuture ? '' :
      (words > 0 ? `${currentDate.getMonth()+1}月${currentDate.getDate()}日: ${words} 字` :
       `${currentDate.getMonth()+1}月${currentDate.getDate()}日: 未写作`);

    if (isThisYear || currentDate < startDate) {
      weekHtml += '<div class="calendar-day ' + level + '" ' + (tooltip ? 'data-tooltip="' + tooltip + '"' : '') + '></div>';
    }

    currentDate.setDate(currentDate.getDate() + 1);
    if (currentDate > endDate && currentDate.getDay() === 1) break;
  }

  if (weekHtml) {
    weeksHtml += '<div class="calendar-week">' + weekHtml + '</div>';
    weekCount++;
  }

  grid.innerHTML = weeksHtml;

  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayWidth = 16;
  let monthsHtml = '<span style="width:20px;flex-shrink:0;"></span>';
  for (let i = 0; i < monthPositions.length; i++) {
    const pos = monthPositions[i];
    const nextPos = monthPositions[i + 1];
    const width = nextPos ? (nextPos.week - pos.week) * dayWidth : (weekCount - pos.week) * dayWidth;
    monthsHtml += '<span class="calendar-month-label" style="width:' + width + 'px;">' + monthNames[pos.month] + '</span>';
  }
  monthsRow.innerHTML = monthsHtml;
}
