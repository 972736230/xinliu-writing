<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心流写作</title>
<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-hover: #F5F5F3;
    --border: #E8E8E4;
    --border-light: #F0F0EC;
    --text-primary: #1A1A18;
    --text-secondary: #6B6B66;
    --text-tertiary: #9C9C96;
    --accent: #2D5A27;
    --accent-light: #E8F0E6;
    --accent-hover: #3D7A35;
    --orange: #C4660A;
    --orange-light: #FFF3E6;
    --red: #B83232;
    --red-light: #FDEAEA;
    --blue: #2D5A8A;
    --blue-light: #E6EEF8;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Login Screen ===== */
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 48px 40px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    max-width: 400px;
    width: 100%;
  }

  .login-logo {
    width: 64px; height: 64px;
    background: var(--accent);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 32px;
    margin: 0 auto 20px;
  }

  .login-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
  .login-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }

  .btn-google {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .btn-google:hover { background: var(--surface-hover); box-shadow: var(--shadow-md); }

  .btn-google svg { width: 20px; height: 20px; }

  .login-loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== User Bar ===== */
  .user-bar {
    display: flex; align-items: center; gap: 10px;
  }

  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border);
  }

  .user-name { font-size: 13px; color: var(--text-secondary); }

  .btn-logout {
    padding: 4px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: transparent;
    font-size: 12px; color: var(--text-tertiary);
    cursor: pointer; transition: all var(--transition);
  }
  .btn-logout:hover { color: var(--red); border-color: var(--red); background: var(--red-light); }

  .btn-export {
    padding: 6px 12px; border: 1px solid var(--accent);
    border-radius: 6px; background: var(--accent-light);
    font-size: 12px; font-weight: 500; color: var(--accent);
    cursor: pointer; transition: all var(--transition);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-export:hover { background: var(--accent); color: white; }

  /* ===== App Shell ===== */
  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    transition: max-width 0.35s ease, padding 0.35s ease;
    display: none;
  }

  .app.visible { display: block; }

  .app.split-mode {
    max-width: 100%;
    padding: 24px 32px 80px;
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px;
  }

  .logo h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header-date { font-size: 14px; color: var(--text-secondary); }

  /* ===== Navigation ===== */
  .nav-tabs {
    display: flex; gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 4px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }

  .nav-tab {
    flex: 1;
    padding: 10px 16px;
    border: none; background: transparent;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .nav-tab:hover { color: var(--text-primary); background: var(--surface-hover); }
  .nav-tab.active { background: var(--accent); color: white; box-shadow: var(--shadow-sm); }

  .nav-tab .badge {
    background: rgba(255,255,255,0.25);
    font-size: 11px; padding: 1px 7px;
    border-radius: 99px; font-weight: 600;
  }
  .nav-tab:not(.active) .badge { background: var(--border); color: var(--text-secondary); }

  /* ===== Views ===== */
  .view { display: none; }
  .view.active { display: flex; flex-direction: column; animation: fadeIn 0.25s ease; }
  #view-write.active {
    height: calc(100vh - 140px);
    overflow: hidden;
  }
  #view-ideas.active, #view-research.active, #view-history.active {
    display: block;
  }

  .write-top { flex-shrink: 0; }

  .split-container { flex: 1; min-height: 0; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Split Layout ===== */
  .split-container {
    display: flex;
    gap: 20px;
  }

  .split-left {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column;
    transition: flex 0.35s ease;
  }

  .split-left .editor-wrap { flex: 1; min-height: 0; }

  .split-right {
    flex: 0;
    min-width: 0;
    overflow: hidden;
    opacity: 0;
    display: flex; flex-direction: column;
    transition: flex 0.35s ease, opacity 0.3s ease;
  }

  .split-right .editor-wrap { flex: 1; min-height: 0; }

  .split-mode .split-left { flex: 1; }
  .split-mode .split-right { flex: 1; opacity: 1; }

  /* ===== Stats ===== */
  .writing-stats { display: flex; gap: 12px; margin-bottom: 16px; }

  .stat-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }

  .stat-label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }

  .timer-card.running .stat-value { color: var(--accent); }
  .words-card.excellent .stat-value { color: var(--accent); }
  .words-card.excellent .stat-sub { color: var(--accent); }

  /* Progress */
  .progress-wrap { margin-bottom: 16px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .progress-label { font-size: 13px; color: var(--text-secondary); }
  .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s ease; width: 0%; }

  /* Controls */
  .timer-controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  .btn {
    padding: 10px 20px; border: none;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all var(--transition);
    display: inline-flex; align-items: center; gap: 6px;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--surface-hover); color: var(--text-primary); }
  .btn-danger { background: var(--red-light); color: var(--red); border: 1px solid transparent; }
  .btn-danger:hover { background: #f9d4d4; }

  .quick-idea-trigger {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--orange-light); color: var(--orange);
    border: 1px solid transparent; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--transition);
  }
  .quick-idea-trigger:hover { background: #FFE8CC; }
  .quick-idea-trigger.active { background: #FFE0B8; border-color: var(--orange); }

  .research-toggle {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--blue-light); color: var(--blue);
    border: 1px solid transparent; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--transition);
  }
  .research-toggle:hover { background: #D4E2F2; }
  .research-toggle.active { background: #C4D8EE; border-color: var(--blue); }

  /* ===== Quick Idea Panel ===== */
  .quick-idea-panel {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.2s ease, margin 0.3s ease;
    opacity: 0; margin-bottom: 0;
  }
  .quick-idea-panel.open { max-height: 300px; opacity: 1; margin-bottom: 16px; }

  .quick-idea-inner {
    background: var(--surface);
    border: 1px solid var(--orange);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .quick-idea-header { display: flex; justify-content: space-between; align-items: center; }
  .quick-idea-label { font-size: 13px; font-weight: 600; color: var(--orange); display: flex; align-items: center; gap: 5px; }

  .panel-close {
    background: none; border: none; color: var(--text-tertiary);
    cursor: pointer; font-size: 14px; padding: 2px 6px;
    border-radius: 4px; transition: all var(--transition);
  }
  .panel-close:hover { color: var(--text-primary); background: var(--surface-hover); }

  .quick-idea-row { display: flex; gap: 8px; align-items: stretch; }

  textarea.quick-idea-input, .quick-idea-input {
    flex: 1; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text-primary);
    outline: none; resize: vertical; min-height: 60px; line-height: 1.5;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .quick-idea-input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(196,102,10,0.1); }
  .quick-idea-input::placeholder { color: var(--text-tertiary); }

  .btn-orange {
    background: var(--orange); color: white;
    padding: 10px 16px; border: none; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--transition); white-space: nowrap;
  }
  .btn-orange:hover { background: #A8560A; }

  .quick-idea-recent { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-idea-chip {
    font-size: 12px; padding: 4px 10px;
    background: var(--orange-light); color: var(--orange);
    border-radius: 99px;
    max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .kbd-hint { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
  kbd {
    background: var(--surface-hover); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: inherit;
  }

  /* ===== Editor (shared) ===== */
  .editor-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow var(--transition), border-color var(--transition);
    display: flex; flex-direction: column;
  }

  .editor-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light), var(--shadow-md);
  }

  .editor-wrap.research-editor:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-light), var(--shadow-md);
  }

  .editor-toolbar {
    display: flex; align-items: center; gap: 2px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--border-light);
    background: var(--surface-hover);
    flex-wrap: wrap; flex-shrink: 0;
  }

  .toolbar-btn {
    padding: 4px 8px; border: 1px solid transparent;
    border-radius: 6px; background: transparent;
    color: var(--text-secondary);
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all var(--transition); line-height: 1.2;
  }

  .toolbar-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text-primary); }
  .toolbar-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent-light); }

  .research-editor .toolbar-btn.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue-light); }

  .toolbar-divider { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

  .toolbar-btn.h1 { font-size: 15px; }
  .toolbar-btn.h2 { font-size: 14px; }
  .toolbar-btn.p-btn { font-weight: 400; }

  .rich-editor {
    width: 100%;
    padding: 20px;
    border: none; outline: none;
    font-size: 16px; line-height: 1.8;
    color: var(--text-primary);
    background: transparent;
    overflow-y: auto; font-family: inherit;
    flex: 1; min-height: 0;
  }

  .rich-editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text-tertiary);
    pointer-events: none;
  }

  .rich-editor h1 { font-size: 28px; font-weight: 700; line-height: 1.3; margin: 16px 0 8px; letter-spacing: -0.5px; }
  .rich-editor h2 { font-size: 24px; font-weight: 700; line-height: 1.3; margin: 14px 0 6px; letter-spacing: -0.3px; }
  .rich-editor h3 { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 12px 0 6px; }
  .rich-editor h4 { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 10px 0 4px; }
  .rich-editor h5 { font-size: 16px; font-weight: 600; line-height: 1.5; margin: 8px 0 4px; }
  .rich-editor h6 { font-size: 14px; font-weight: 600; line-height: 1.5; margin: 8px 0 4px; color: var(--text-secondary); }
  .rich-editor p { margin: 0 0 8px; }

  .editor-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px;
    border-top: 1px solid var(--border-light);
    background: var(--surface-hover);
    flex-shrink: 0;
  }

  .editor-hint { font-size: 12px; color: var(--text-tertiary); }
  .save-indicator {
    font-size: 12px; color: var(--text-tertiary);
    display: flex; align-items: center; gap: 4px;
    opacity: 0; transition: opacity var(--transition);
  }
  .save-indicator.show { opacity: 1; }

  /* ===== Research Panel (right side) ===== */
  .research-panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }

  .research-panel-title {
    font-size: 16px; font-weight: 600; color: var(--blue);
    display: flex; align-items: center; gap: 6px;
  }

  .research-panel-actions { display: flex; gap: 8px; align-items: center; }

  .btn-blue {
    background: var(--blue); color: white;
    padding: 8px 16px; border: none; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--transition);
  }
  .btn-blue:hover { background: #1E4A75; }

  .btn-blue-outline {
    background: transparent; color: var(--blue);
    padding: 8px 16px; border: 1px solid var(--blue); border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all var(--transition);
  }
  .btn-blue-outline:hover { background: var(--blue-light); }

  .research-title-input {
    width: 100%; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600; font-family: inherit;
    background: var(--surface); color: var(--text-primary);
    outline: none; margin-bottom: 10px;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .research-title-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(45,90,138,0.1); }
  .research-title-input::placeholder { color: var(--text-tertiary); font-weight: 400; }

  .research-panel-header { flex-shrink: 0; }
  .split-right .research-title-input { flex-shrink: 0; }

  /* ===== Ideas View ===== */
  .idea-input-wrap { display: flex; gap: 8px; margin-bottom: 24px; }

  .idea-input {
    flex: 1; padding: 12px 16px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 15px; font-family: inherit;
    background: var(--surface); color: var(--text-primary);
    outline: none; transition: border-color var(--transition), box-shadow var(--transition);
  }
  .idea-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .idea-input::placeholder { color: var(--text-tertiary); }

  .ideas-list { display: flex; flex-direction: column; gap: 8px; }

  .idea-item {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 14px 18px;
    display: flex; align-items: flex-start; gap: 12px;
    box-shadow: var(--shadow-sm); transition: all var(--transition);
  }
  .idea-item:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }

  .idea-bullet { width: 8px; height: 8px; min-width: 8px; background: var(--orange); border-radius: 50%; margin-top: 7px; }
  .idea-content { flex: 1; }
  .idea-text { font-size: 15px; color: var(--text-primary); margin-bottom: 4px; }
  .idea-meta { font-size: 12px; color: var(--text-tertiary); }

  .idea-delete {
    background: none; border: none; color: var(--text-tertiary);
    cursor: pointer; padding: 4px; border-radius: 4px;
    font-size: 16px; line-height: 1; transition: all var(--transition); opacity: 0;
  }
  .idea-item:hover .idea-delete { opacity: 1; }
  .idea-delete:hover { color: var(--red); background: var(--red-light); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state-text { font-size: 15px; margin-bottom: 4px; color: var(--text-secondary); }
  .empty-state-sub { font-size: 13px; }

  /* ===== Research Tab View ===== */
  .research-tab-input {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 18px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }

  .research-tab-input .research-title-input { margin-bottom: 12px; }

  .research-tab-body {
    width: 100%; padding: 10px 0; border: none; outline: none;
    font-size: 15px; font-family: inherit; color: var(--text-primary);
    background: transparent; resize: vertical; min-height: 100px; line-height: 1.7;
  }
  .research-tab-body::placeholder { color: var(--text-tertiary); }

  .research-tab-actions {
    display: flex; justify-content: flex-end;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-light);
  }

  .research-list { display: flex; flex-direction: column; gap: 12px; }

  .research-item {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    overflow: hidden; box-shadow: var(--shadow-sm); transition: all var(--transition);
  }
  .research-item:hover { border-color: var(--blue); box-shadow: var(--shadow-md); }

  .research-item-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; cursor: pointer;
  }

  .research-item-title {
    font-size: 15px; font-weight: 600; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  .research-item-title::before {
    content: ''; width: 8px; height: 8px; min-width: 8px;
    background: var(--blue); border-radius: 50%;
  }

  .research-item-meta { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; gap: 8px; }

  .research-item-body {
    padding: 0 18px 16px 34px;
    font-size: 14px; line-height: 1.7; color: var(--text-secondary);
    white-space: pre-wrap; display: none;
  }
  .research-item.expanded .research-item-body { display: block; }

  .research-item-delete {
    background: none; border: none; color: var(--text-tertiary);

// ===== Firestore helpers =====
function userCol(name) { return userDocRef.collection(name); }

async function fsGet(colName) {
  const snap = await userCol(colName).orderBy('createdAt', 'desc').get();
  return snap.docs.map(d => ({ _docId: d.id, ...d.data() }));
}

async function fsAdd(colName, data) {
  data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
  data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  const ref = await userCol(colName).add(data);
  return ref.id;
}

async function fsUpdate(colName, docId, data) {
  data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  await userCol(colName).doc(docId).update(data);
}

async function fsDelete(colName, docId) {
  await userCol(colName).doc(docId).delete();
}

async function fsGetDoc(colName, docId) {
  const snap = await userCol(colName).doc(docId).get();
  return snap.exists ? { _docId: snap.id, ...snap.data() } : null;
}

// ===== Editor helpers =====
function getEditorEl() { return document.getElementById('editor'); }
function getEditorText() { return getEditorEl().innerText || ''; }
function getEditorHTML() { return getEditorEl().innerHTML || ''; }
function setEditorHTML(html) { getEditorEl().innerHTML = html; }
function clearEditor() { getEditorEl().innerHTML = ''; }

// ===== Format Block =====
function formatBlock(editorId, tag) {
  const el = document.getElementById(editorId);
  const sel = window.getSelection();
  const savedRange = sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
  if (document.activeElement !== el) {
    el.focus();
    if (savedRange && el.contains(savedRange.startContainer)) {
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }
  }
  document.execCommand('formatBlock', false, tag);
  updateToolbarState(editorId);
}

function updateToolbarState(editorId) {
  const editorEl = document.getElementById(editorId);
  const toolbar = editorEl.closest('.editor-wrap').querySelector('.editor-toolbar');
  if (!toolbar) return;
  toolbar.querySelectorAll('.toolbar-btn').forEach(b => b.classList.remove('active'));
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  let node = sel.anchorNode;
  while (node && node !== editorEl) {
    if (node.nodeType === 1) {
      const tag = node.tagName;
      const btn = toolbar.querySelector(`.toolbar-btn[onclick*="'${tag}'"]`);
      if (btn) btn.classList.add('active');
      return;
    }
    node = node.parentNode;
  }
  const pBtn = toolbar.querySelector('.toolbar-btn.p-btn');
  if (pBtn) pBtn.classList.add('active');
}

// ===== Date helpers =====
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate() {
  const d = new Date();
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;
}

function formatHistoryDate(dateStr) {
  const [y, m, d] = dateStr.split('-');
  if (dateStr === todayKey()) return '今天';
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
  if (dateStr === yKey) return '昨天';
  return `${parseInt(m)}月${parseInt(d)}日`;
}

// ===== Word Count =====
function countWords(text) {
  if (!text || !text.trim()) return 0;
  const cjk = (text.match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g) || []).length;
  const stripped = text.replace(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g, ' ');
  const words = stripped.split(/\s+/).filter(w => w.length > 0).length;
  return cjk + words;
}

function updateWordCount() {
  const text = getEditorText();
  const count = countWords(text);
  document.getElementById('wordCount').textContent = count;
  const progress = Math.min(count / 1000, 1);
  document.getElementById('progressFill').style.width = (progress * 100) + '%';
  document.getElementById('progressPercent').textContent = Math.round(progress * 100) + '%';
  const card = document.getElementById('wordsCard');
  const sub = document.getElementById('wordsSub');
  const label = document.getElementById('progressLabel');
  if (count >= 1000) {
    card.classList.add('excellent');
    sub.textContent = '太棒了！已达成目标';
    label.textContent = '目标已达成！';
  } else {
    card.classList.remove('excellent');
    sub.textContent = `还差 ${1000 - count} 字`;
    label.textContent = '距离目标 1000 字';
  }
}

// ===== Timer =====
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function toggleTimer() {
  if (isTimerRunning) pauseTimer();
  else startTimer();
}

function startTimer() {
  isTimerRunning = true;
  document.getElementById('timerCard').classList.add('running');
  document.getElementById('btnStart').innerHTML = '&#10074;&#10074; 暂停';
  document.getElementById('btnReset').style.display = '';
  document.getElementById('editor').focus();
  timerInterval = setInterval(() => {
    timerSeconds++;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
  }, 1000);
}

function pauseTimer() {
  isTimerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerCard').classList.remove('running');
  document.getElementById('btnStart').innerHTML = '&#9654; 继续写作';
}

let resetPending = false;
async function resetToday() {
  if (!resetPending) {
    resetPending = true;
    const btn = document.getElementById('btnReset');
    btn.textContent = '确认清空？';
    btn.classList.remove('btn-secondary'); btn.classList.add('btn-danger');
    setTimeout(() => { if (resetPending) { resetPending = false; btn.textContent = '重新开始'; btn.classList.remove('btn-danger'); btn.classList.add('btn-secondary'); } }, 3000);
    return;
  }
  resetPending = false;
  pauseTimer();
  timerSeconds = 0;
  document.getElementById('timerDisplay').textContent = '00:00';
  document.getElementById('timerCard').classList.remove('running');
  clearEditor();
  document.getElementById('btnStart').innerHTML = '&#9654; 开始写作';
  const btn = document.getElementById('btnReset');
  btn.style.display = 'none';
  btn.textContent = '重新开始';
  btn.classList.remove('btn-danger'); btn.classList.add('btn-secondary');
  document.getElementById('writingTitle').value = '';
  updateWordCount();
  // Delete today's doc from Firestore
  if (todayDocId) {
    await fsDelete('today', todayDocId);
    todayDocId = null;
    todayData = null;
  }
}

// ===== Auto-save (to Firestore) =====
async function autoSave() {
  const html = getEditorHTML();
  const text = getEditorText();
  const title = document.getElementById('writingTitle').value.trim();
  const date = todayKey();
  const wc = countWords(text);

  // Save/update today's working doc
  const payload = { title, html, text, date, wordCount: wc, timerSeconds };
  if (todayDocId) {
    await fsUpdate('today', todayDocId, payload);
  } else {
    todayDocId = await fsAdd('today', payload);
  }

  // Upsert auto-save in history
  await saveToHistory(text, html, title, 'auto');

  const ind = document.getElementById('saveIndicator');
  ind.textContent = '\u2713 已自动保存';
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 1500);
}

async function manualSave() {
  const text = getEditorText();
  if (!text.trim()) return;
  const html = getEditorHTML();
  const title = document.getElementById('writingTitle').value.trim();

  // Save today's doc
  const date = todayKey();
  const wc = countWords(text);
  const payload = { title, html, text, date, wordCount: wc, timerSeconds };
  if (todayDocId) {
    await fsUpdate('today', todayDocId, payload);
  } else {
    todayDocId = await fsAdd('today', payload);
  }

  await saveToHistory(text, html, title, 'manual');
  showSaveToast('已手动保存！', 'manual');

  const ind = document.getElementById('saveIndicator');
  ind.textContent = '\u2713 已手动保存';
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2500);
}

async function saveToHistory(text, html, title, saveType) {
  if (!text.trim()) return;
  const date = todayKey();
  const wc = countWords(text);

  if (saveType === 'auto') {
    // Find existing auto entry for today
    const existing = historyCache.find(h => h.date === date && h.saveType === 'auto');
    if (existing) {
      await fsUpdate('history', existing._docId, { title, text, html, wordCount: wc, timerSeconds, saveType: 'auto' });
      existing.title = title; existing.text = text; existing.html = html;
      existing.wordCount = wc; existing.timerSeconds = timerSeconds;
    } else {
      const docId = await fsAdd('history', { date, title, text, html, wordCount: wc, timerSeconds, saveType: 'auto' });
      historyCache.unshift({ _docId: docId, date, title, text, html, wordCount: wc, timerSeconds, saveType: 'auto' });
    }
  } else {
    const docId = await fsAdd('history', { date, title, text, html, wordCount: wc, timerSeconds, saveType: 'manual' });
    historyCache.unshift({ _docId: docId, date, title, text, html, wordCount: wc, timerSeconds, saveType: 'manual' });
  }
  renderStatsSidebar();
}

// ===== History =====
let historyFilter = 'all';
let historyDateFrom = '';
let historyDateTo = '';
let historyTagFilter = '';

function updateHistoryBadge() {
  const el = document.getElementById('historyBadge');
  if (el) el.textContent = historyCache.length;
}

function extractHashtags(text) {
  const matches = (text || '').match(/#([\w\u4e00-\u9fa5]+)/g) || [];
  return [...new Set(matches)];
}

// Compute hashtag counts from a given set of items (not all history)
function renderHashtagCloud(baseItems) {
  const cloud = document.getElementById('hashtagCloud');
  if (!cloud) return;
  const counts = {};
  (baseItems || []).forEach(entry => {
    extractHashtags((entry.text || '') + ' ' + (entry.title || '')).forEach(tag => {
      counts[tag] = (counts[tag] || 0) + 1;
    });
  });
  const tags = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (tags.length === 0) {
    // If active tag no longer exists in filtered set, clear it
    if (historyTagFilter) historyTagFilter = '';
    cloud.innerHTML = '';
    return;
  }
  // If active tag not present in this set, clear it
  if (historyTagFilter && !counts[historyTagFilter]) historyTagFilter = '';
  cloud.innerHTML = tags.map(([tag, count]) =>
    `<span class="tag-chip${historyTagFilter === tag ? ' active' : ''}" onclick="filterByTag('${escapeHTML(tag)}')">
      ${escapeHTML(tag)} <span class="tag-count">(${count})</span>
    </span>`
  ).join('');
}

function filterByTag(tag) {
  historyTagFilter = historyTagFilter === tag ? '' : tag;
  renderHistory();
}

function filterHistory(filter) {
  historyFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');
  renderHistory();
}

function applyDateFilter() {
  historyDateFrom = document.getElementById('dateFrom').value;
  historyDateTo = document.getElementById('dateTo').value;
  const clearBtn = document.getElementById('dateClearBtn');
  if (clearBtn) clearBtn.style.display = (historyDateFrom || historyDateTo) ? '' : 'none';
  renderHistory();
}

function clearDateFilter() {
  historyDateFrom = ''; historyDateTo = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  const clearBtn = document.getElementById('dateClearBtn');
  if (clearBtn) clearBtn.style.display = 'none';
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyList');

  // Step 1: base filter (type + date) — used for hashtag cloud
  let baseItems = [...historyCache];
  if (historyFilter !== 'all') baseItems = baseItems.filter(h => h.saveType === historyFilter);
  if (historyDateFrom) baseItems = baseItems.filter(h => (h.date || '') >= historyDateFrom);
  if (historyDateTo)   baseItems = baseItems.filter(h => (h.date || '') <= historyDateTo);

  // Step 2: render hashtag cloud based on base items (before tag filter)
  renderHashtagCloud(baseItems);

  // Step 3: apply hashtag filter on top
  let items = historyTagFilter
    ? baseItems.filter(h => extractHashtags((h.text || '') + ' ' + (h.title || '')).includes(historyTagFilter))
    : baseItems;

  if (items.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">&#128218;</div><div class="empty-state-text">没有符合条件的记录</div><div class="empty-state-sub">试试调整筛选条件</div></div>`;
    return;
  }
  container.innerHTML = items.map(entry => {
    const dateLabel = formatHistoryDate(entry.date || todayKey());
    const mins = Math.floor((entry.timerSeconds || 0) / 60);
    const isExcellent = entry.wordCount >= 1000;
    const preview = (entry.text || '').substring(0, 120).replace(/\n/g, ' ');
    const saveType = entry.saveType || 'auto';
    const saveLabel = saveType === 'manual'
      ? '<span class="history-badge badge-manual">手动保存</span>'
      : '<span class="history-badge badge-auto">自动保存</span>';
    const d = entry.updatedAt instanceof Date ? entry.updatedAt : (entry.updatedAt?.toDate ? entry.updatedAt.toDate() : null);
    const timeStr = d ? ` ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
    const titleStr = entry.title ? `<span style="font-weight:600;margin-right:6px;">${escapeHTML(entry.title)}</span> · ` : '';
    const tags = extractHashtags((entry.text || '') + ' ' + (entry.title || ''));
    const tagsHTML = tags.length ? `<div class="card-tags">${tags.map(t => `<span class="card-tag">${escapeHTML(t)}</span>`).join('')}</div>` : '';
    return `<div class="history-item">
      <div class="history-item-row">
        <div class="history-item-content" onclick="openDetail('${entry._docId}')">
          <div class="history-header">
            <span class="history-date">${titleStr}${dateLabel}${timeStr}</span>
            <div class="history-badges">
              ${saveLabel}
              ${isExcellent ? '<span class="history-badge badge-excellent">&#10024; 优秀</span>' : ''}
              <span class="history-badge badge-words">${entry.wordCount || 0} 字</span>
              <span class="history-badge badge-time">${mins} 分钟</span>
            </div>
          </div>
          <div class="history-preview">${escapeHTML(preview)}...</div>
          ${tagsHTML}
        </div>
        <div class="history-item-actions">
          <button class="history-delete-btn" onclick="event.stopPropagation();deleteHistoryInline('${entry._docId}',this)">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function buildTOC(contentEl) {
  const headings = contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
  const tocContainer = document.getElementById('sliderToc');
  const tocList = document.getElementById('tocList');
  tocList.innerHTML = '';
  if (headings.length === 0) { tocContainer.classList.add('empty'); return; }
  tocContainer.classList.remove('empty');
  headings.forEach((heading, i) => {
    const tag = heading.tagName.toLowerCase();
    const text = heading.textContent.trim();
    if (!text) return;
    heading.id = 'toc-heading-' + i;
    const li = document.createElement('li');
    li.className = 'toc-item toc-' + tag;
    li.innerHTML = `<span class="toc-tag">${tag.toUpperCase()}</span><span class="toc-text">${escapeHTML(text)}</span>`;
    li.onclick = () => heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
    tocList.appendChild(li);
  });
}

// ===== Save Slider Edit =====
async function saveSliderEdit() {
  if (!currentModalDocId) return;
  const entry = historyCache.find(h => h._docId === currentModalDocId);
  if (!entry) return;

  const btn = document.getElementById('btnSaveEdit');
  btn.disabled = true;
  btn.textContent = '保存中…';

  // Archive current version before overwriting
  const archivedVersion = {
    savedAt: (entry.updatedAt && entry.updatedAt.toDate ? entry.updatedAt.toDate().toISOString() : new Date().toISOString()),
    title: entry.title || '',
    html: entry.html || '',
    text: entry.text || ''
  };

  // Get new values from the editable UI
  const newTitle = document.getElementById('sliderTitleInput').value.trim();
  const bodyEl = document.getElementById('sliderBody');
  const newHtml = bodyEl.innerHTML;
  const newText = bodyEl.innerText || bodyEl.textContent || '';
  const newWc = countWords(newText);

  const versions = Array.isArray(entry.versions) ? [...entry.versions] : [];
  versions.push(archivedVersion);

  try {
    await fsUpdate('history', currentModalDocId, {
      title: newTitle,
      html: newHtml,
      text: newText,
      wordCount: newWc,
      versions: versions
    });

    // Update local cache
    entry.title = newTitle;
    entry.html = newHtml;
    entry.text = newText;
    entry.wordCount = newWc;
    entry.versions = versions;

    // Return to view mode
    bodyEl.contentEditable = 'false';
    const saveLabel = entry.saveType === 'manual' ? ' (手动保存)' : ' (自动保存)';
    const titlePart = newTitle ? newTitle + ' — ' : '';
    const titleDiv = document.getElementById('sliderTitle');
    titleDiv.style.display = '';
    titleDiv.textContent = titlePart + formatHistoryDate(entry.date || todayKey()) + '的写作' + saveLabel;
    document.getElementById('sliderTitleInput').style.display = 'none';
    document.getElementById('btnEnterEdit').style.display = '';
    document.getElementById('btnSaveEdit').style.display = 'none';
    document.getElementById('btnCancelEdit').style.display = 'none';

    renderVersionHistory(versions);
    renderHistory();
    showSaveToast('修改已保存', 'success');
  } catch(e) {
    console.error('Save edit error:', e);

// ===== Version History Accordion =====
function renderVersionHistory(versions) {
  const container = document.getElementById('versionHistory');
  if (!versions || versions.length === 0) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = '';

  // Versions stored oldest-first; display newest-first
  const sorted = [...versions].reverse();

  const itemsHTML = sorted.map((v, idx) => {
    const actualIdx = versions.length - 1 - idx; // index in original array (oldest-first)
    const vNum = versions.length - idx; // display number (newest = highest)
    const dateStr = v.savedAt ? formatVersionDate(v.savedAt) : '—';
    const preview = (v.text || v.html || '').replace(/<[^>]*>/g, '').substring(0, 60).trim();
    const bodyContent = v.html
      ? `<div style="font-size:13px;line-height:1.7;color:var(--text-secondary)">${v.html}</div>`
      : `<div style="font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--text-secondary)">${escapeHTML(v.text || '')}</div>`;
    return `
      <div class="version-item" id="vitem-${idx}">
        <div class="version-item-header" onclick="toggleVersionItem(${idx})">
          <span class="version-label">V${vNum}</span>
          <span class="version-date">${dateStr}</span>
          <span class="version-preview-text">${escapeHTML(preview)}</span>
          <button class="version-delete-btn" id="vdel-${actualIdx}" onclick="event.stopPropagation();deleteVersion(${actualIdx},this)" title="删除此版本">&#10005;</button>
          <span class="version-item-toggle">&#9656;</span>
        </div>
        <div class="version-item-body">${bodyContent}</div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="version-history-header" onclick="toggleVersionHistory()">
      <span class="version-history-label">版本记录（${versions.length}）</span>
      <span class="version-history-toggle">&#9656;</span>
    </div>
    <div class="version-history-list" id="versionHistoryList">${itemsHTML}</div>`;
}

async function deleteVersion(actualIdx, btn) {
  if (!currentModalDocId) return;
  const entry = historyCache.find(h => h._docId === currentModalDocId);
  if (!entry || !Array.isArray(entry.versions)) return;

  if (!btn.dataset.confirming) {
    btn.dataset.confirming = 'true';
    btn.textContent = '确认？';
    btn.style.color = 'var(--red)';
    btn.style.fontWeight = '600';
    setTimeout(() => {
      if (btn.dataset.confirming) {
        delete btn.dataset.confirming;
        btn.innerHTML = '&#10005;';
        btn.style.color = '';
        btn.style.fontWeight = '';
      }
    }, 3000);
    return;
  }

  delete btn.dataset.confirming;
  const versions = [...entry.versions];
  versions.splice(actualIdx, 1);
  try {
    await fsUpdate('history', currentModalDocId, { versions });
    entry.versions = versions;
    renderVersionHistory(versions);
  } catch(e) {
    console.error('Delete version error:', e);
  }
}

function formatVersionDate(isoStr) {
  try {
    const d = new Date(isoStr);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const h = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day} ${h}:${min}`;
  } catch(e) { return isoStr; }
}

    (item.createdAt?.toDate ? item.createdAt.toDate() : new Date()))));

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function sanitizeFilename(str) {
  return str.replace(/[\/\\:*?"<>|]/g, '_').replace(/\s+/g, '_').substring(0, 60);
}

function htmlToMarkdown(html) {
  if (!html) return '';
  const div = document.createElement('div');
  div.innerHTML = html;
  let md = '';
  function walk(node) {
    if (node.nodeType === 3) { md += node.textContent; return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName;
    if (/^H[1-6]$/.test(tag)) {
      const level = parseInt(tag[1]);
      md += '\n' + '#'.repeat(level) + ' ';
      for (const c of node.childNodes) walk(c);
      md += '\n\n';
    } else if (tag === 'P') {
      for (const c of node.childNodes) walk(c);
      md += '\n\n';
    } else if (tag === 'BR') {
      md += '\n';
    } else if (tag === 'B' || tag === 'STRONG') {
      md += '**';
      for (const c of node.childNodes) walk(c);
      md += '**';
    } else if (tag === 'I' || tag === 'EM') {
      md += '*';
      for (const c of node.childNodes) walk(c);
      md += '*';
    } else if (tag === 'DIV') {
      for (const c of node.childNodes) walk(c);
      md += '\n';
    } else {
      for (const c of node.childNodes) walk(c);
    }
  }
  for (const c of div.childNodes) walk(c);
  return md.replace(/\n{3,}/g, '\n\n').trim();
}

function doExport() {
  const files = [];

  // Export selected history items
  historyCache.forEach(entry => {
    if (!exportSelections.history.has(entry._docId)) return;
    const date = entry.date || todayKey();
    const title = entry.title || '无标题';
    const saveType = entry.saveType === 'manual' ? '手动保存' : '自动保存';
    const wc = entry.wordCount || 0;
    const mins = Math.floor((entry.timerSeconds || 0) / 60);
    let content = `---\ntitle: "${title}"\ndate: ${date}\ntype: writing\nword_count: ${wc}\nwriting_minutes: ${mins}\nsave_type: ${saveType}\n---\n\n`;
    if (entry.title) content += `# ${entry.title}\n\n`;
    content += entry.html ? htmlToMarkdown(entry.html) : (entry.text || '');
    const filename = `${sanitizeFilename(title)}_${date}.md`;
    files.push({ filename, content });
  });

  // Export selected ideas
  const selectedIdeas = ideasCache.filter(i => exportSelections.ideas.has(i._docId));
  if (selectedIdeas.length > 0) {
    let content = `---\ntitle: "随机想法"\ndate: ${todayKey()}\ntype: ideas\n---\n\n# 随机想法\n\n`;
    selectedIdeas.forEach(idea => {
      const d = idea.createdAt instanceof Date ? idea.createdAt : (idea.createdAt?.toDate ? idea.createdAt.toDate() : new Date());
      const t = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      content += `- **${t}**: ${idea.text}\n`;
    });
    files.push({ filename: `随机想法_${todayKey()}.md`, content });
  }

  // Export selected research items
  researchCache.forEach(item => {
    if (!exportSelections.research.has(item._docId)) return;
    const dateStr = getItemDate(item);
    const title = item.title || '未命名调研';
    let content = `---\ntitle: "${title}"\ndate: ${dateStr}\ntype: research\n---\n\n# ${title}\n\n`;
    content += item.bodyHTML ? htmlToMarkdown(item.bodyHTML) : (item.body || '');
    const filename = `${sanitizeFilename(title)}_${dateStr}.md`;
    files.push({ filename, content });
  });

  if (files.length === 0) {
    showSaveToast('没有可导出的内容', 'auto');
    closeExportModal();
    return;
  }

  // Download each file individually
  files.forEach(f => downloadFile(f.filename, f.content));

  showSaveToast(`已导出 ${files.length} 个文件！`, 'manual');
  closeExportModal();
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== Stats Sidebar =====
let _hmYear = new Date().getFullYear();
let _hmMonth = new Date().getMonth();
let _hmDayWords = {};

function renderStatsSidebar() {
  const dayWords = {};
  historyCache.forEach(entry => {
    if (entry.date) dayWords[entry.date] = (dayWords[entry.date] || 0) + (entry.wordCount || 0);
  });
  _hmDayWords = dayWords;

  // 1. Total words
  const totalWords = Object.values(dayWords).reduce((a, b) => a + b, 0);
  const elW = document.getElementById('statTotalWords');
  if (elW) elW.textContent = totalWords >= 10000
    ? (totalWords / 10000).toFixed(1) + '万'
    : totalWords.toLocaleString('zh-CN');

  // 2. Days this year
  const yr = new Date().getFullYear();
  const isLeap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0;
  const elY = document.getElementById('statYearDays');
  const daysThisYear = Object.keys(dayWords).filter(d => d.startsWith(String(yr))).length;
  if (elY) elY.textContent = daysThisYear + '/' + (isLeap ? 366 : 365) + '天';

  // 3. Streak
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayStr = fmt(new Date());
  const yestStr = fmt(new Date(Date.now() - 86400000));
  let streak = 0;
  let startStr = dayWords[todayStr] ? todayStr : (dayWords[yestStr] ? yestStr : null);
  if (startStr) {
    let cursor = new Date(startStr + 'T12:00:00');
    while (dayWords[fmt(cursor)]) { streak++; cursor.setDate(cursor.getDate() - 1); }
  }
  const elS = document.getElementById('statStreak');
  if (elS) elS.textContent = streak + '天';

  // 4. Reset to current month and render
  _hmYear = new Date().getFullYear();
  _hmMonth = new Date().getMonth();
  renderHeatmap();
}

function heatmapPrevMonth() {
  _hmMonth--;
  if (_hmMonth < 0) { _hmMonth = 11; _hmYear--; }
  renderHeatmap();
}

function heatmapNextMonth() {
  const now = new Date();
  if (_hmYear === now.getFullYear() && _hmMonth === now.getMonth()) return;
  _hmMonth++;
  if (_hmMonth > 11) { _hmMonth = 0; _hmYear++; }
  renderHeatmap();
}

function renderHeatmap() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  // Update title
  const titleEl = document.getElementById('hmMonthTitle');
  if (titleEl) titleEl.textContent = _hmYear + '年' + monthNames[_hmMonth];

  // Disable next btn if already on current month
  const nextBtn = document.getElementById('hmNextBtn');
  if (nextBtn) nextBtn.disabled = (_hmYear === now.getFullYear() && _hmMonth === now.getMonth());

  const grid = document.getElementById('hmGrid');
  if (!grid) return;
  grid.innerHTML = '';

  const firstWeekday = new Date(_hmYear, _hmMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(_hmYear, _hmMonth + 1, 0).getDate();

  // Empty cells for alignment
  for (let i = 0; i < firstWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'hm-cell hm-empty';
    grid.appendChild(e);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${_hmYear}-${String(_hmMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const words = _hmDayWords[dateStr] || 0;
    const isFuture = dateStr > todayStr;
    const isToday = dateStr === todayStr;

    const cell = document.createElement('div');
    cell.className = 'hm-cell ' + (isFuture ? 'hm-future' : words === 0 ? 'hm-0' : words < 300 ? 'hm-1' : words < 800 ? 'hm-2' : 'hm-3');
    if (isToday) cell.classList.add('hm-today');

    if (!isFuture) {
      const label = `${_hmYear}年${_hmMonth+1}月${day}日`;
      const wordsTip = words > 0 ? `${words}字` : '未写作';
      cell.addEventListener('mouseenter', e => showHmTooltip(e, `${label} · ${wordsTip}`));
      cell.addEventListener('mouseleave', hideHmTooltip);
    }
    grid.appendChild(cell);
  }
}

function showHmTooltip(e, text) {
  const tip = document.getElementById('hmTooltip');
  if (!tip) return;
  tip.textContent = text;
  tip.style.display = 'block';
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width / 2) + 'px';
  tip.style.top = (r.top - 8) + 'px';
}

function hideHmTooltip() {
  const tip = document.getElementById('hmTooltip');
  if (tip) tip.style.display = 'none';
}
</script>
</body>
</html>
